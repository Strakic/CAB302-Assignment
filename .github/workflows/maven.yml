name: Java CI with Maven

on:
  push:
    branches: [ "main", "integration", "master" ]
  pull_request:
    branches: [ "main", "integration", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'oracle'
          cache: maven

      - name: Build and Test with Maven
        run: mvn -B test --file pom.xml